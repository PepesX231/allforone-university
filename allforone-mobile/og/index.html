THESIS: A risograph-printed poster world where Hamster Hub's three hamsters cheer at a festive little university gate while a team of three Thai students races up a staircase of giant books toward them, seen from a low angle as the next friend to follow; it refuses the text-first info sheet this category ships.
OWN-WORLD: Five spot inks (navy, gold, red, royal blue, green) on off-white paper with ink grain, halftone and slight misregistration; a printed royal-blue sky (#097DFC) behind a paper-white black-italic poster headline; section sheets printed in the inks (blue, gold, navy) or left as bare paper; a navy ticket with gold numerals, and gold slab buttons keyed in navy with their misregistered copy as the only depth; red, blue and green track inks; everything moves frame by frame: the first screen prints itself once and the visitor's scroll walks a hamster down the four stages.
STORY: Visitors see a team like theirs, learn the four stages and three tracks from pictures, see what everyone takes home and what the top two earn, then register or send a friend an invite.
FIRST VIEWPORT: Top bar; a three-line black-italic headline on the sky, its hook line at full measure, and one line saying what the event is; the stair scene with the team; a navy ticket across the bottom steps with what a team gets (mentors, a real portfolio project, the interview prize) and team size, price and deadline in gold; the register buttons follow at normal size, because the first screen is for understanding the event.
